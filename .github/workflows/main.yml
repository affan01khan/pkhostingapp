name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx vite build && cp dist/client/_shell.html dist/client/index.html
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PKHosting.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PKHosting Android App
          body: Download PKHosting.apk below and open it on your Android phone.
          files: PKHosting.apk
          make_latest: true
