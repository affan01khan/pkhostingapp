name: Build Native PKHosting Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkhosting-native-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PKHosting-Native.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKHosting-Native-APK
          path: PKHosting-Native.apk
          retention-days: 30

      - name: Publish free APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-android-v${{ github.run_number }}
          name: PKHosting Native Android App - Build ${{ github.run_number }}
          body: |
            Native PKHosting Android app built with Kotlin and Jetpack Compose.
            Login, billing and checkout open through secure browser tabs.
          files: PKHosting-Native.apk
          make_latest: true
