<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b36">
  <title>PKHosting</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #071b36; color: #fff; font-family: Arial, sans-serif; }
    main { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 28px; }
    .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; display: grid; place-items: center; background: #0d6efd; font-size: 27px; font-weight: 800; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { color: #c7d5e8; line-height: 1.6; max-width: 320px; }
    a { display: inline-block; margin-top: 14px; padding: 13px 22px; border-radius: 9px; background: #0d6efd; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="mark">PK</div>
    <h1>PKHosting</h1>
    <p>Connect to the internet to open the official PKHosting website and manage your hosting services.</p>
    <a href="https://www.pkhosting.com/">Open PKHosting</a>
  </main>
</body>
</html>
